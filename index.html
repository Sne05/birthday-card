<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>birthday-card</title>
    <style>
        body{
            background-color: rgb(55, 166, 217);
        }
        .birthday-card{
            width: 400px;
            height:300px;
            margin-left: auto;
            margin-right: auto;
            margin-top: 75px;
            border: 95px solid transparent;
            border-image: url("https://static.vecteezy.com/system/resources/thumbnails/036/407/962/small/happy-birthday-for-boy-background-greeting-card-invitation-with-text-space-birthday-elements-design-illustration-vector.jpg") 100 stretch;
            border-image-outset: 30px;
            h1{
                font-size:50px;
                text-align: center;
                font-family: "Mountains of Christmas", serif;
                font-weight: 900;
                font-style: normal;
                color:white;
            }
        }
    </style>
</head>
<body>
     <div class="birthday-card">
           <h1>Wishing You a<br> Happy <br> Birthday!</h1>
     </div>
</body>
</html>
